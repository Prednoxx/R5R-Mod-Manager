name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: cmd
        run: build.cmd test package
      - uses: actions/upload-artifact@v4
        with:
          name: R5R-Mod-Manager-3.3.1
          path: dist/R5R-Mod-Manager-3.3.1.zip
